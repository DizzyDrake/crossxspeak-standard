<script>
(()=>{'use strict';
const KEY='crossxspeak.v1';const PAGE_SIZE=4;const DIRS=['top','right','bottom','left'];
const labels={top:'Above',right:'Right',bottom:'Below',left:'Left'};
const examples={top:['Hello.','Please give me a moment.','Could you repeat that?','Thank you.','I would like to add something.'],right:['Yes.','No.'],bottom:['I need a break.'],left:['Can you help me?']};
const initial=()=>({names:{...labels},phrases:Object.fromEntries(DIRS.map(d=>[d,examples[d].map((text,i)=>({id:d+'-'+i,text}))])),location:'home',page:0,draft:'',rate:1,mode:'speak',voicePreference:null});
let data=initial(),expanded=null,organizing=false,organizerMode="text",saveOpen=false,editOpen=false,storageAvailable=true,gestureStart=null;
// These are transient interaction states, never persisted as speech or phrase history.
let navigationTap=null,phraseFeedback=null,phraseFeedbackTimer=null;
function clearPhraseFeedback(){if(phraseFeedbackTimer!==null){clearTimeout(phraseFeedbackTimer);phraseFeedbackTimer=null;}phraseFeedback=null;paintPhraseFeedback();}
function paintPhraseFeedback(){if(!screen)return;screen.querySelectorAll('.speak-phrase').forEach(b=>{
 const active=phraseFeedback&&phraseFeedback.dir===data.location&&phraseFeedback.id===b.dataset.activate;
 const old=b.querySelector('.phrase-feedback-label');if(old)old.remove();b.removeAttribute('data-feedback');b.removeAttribute('aria-label');
 if(!active)return;
 const phase=phraseFeedback.phase;const words={requested:'✓ Request sent',started:'▶ Browser started',ended:'✓ Browser ended',error:'! Browser error'};
 b.dataset.feedback=phase;b.setAttribute('aria-label',b.textContent+'. '+words[phase]);
 const label=document.createElement('span');label.className='phrase-feedback-label';label.textContent=words[phase];b.appendChild(label);
 });}
function updatePhraseFeedback(epoch,phase){if(!phraseFeedback||phraseFeedback.epoch!==epoch)return;
 phraseFeedback.phase=phase;paintPhraseFeedback();if(phase==='ended'||phase==='error'){
  if(phraseFeedbackTimer!==null)clearTimeout(phraseFeedbackTimer);
  phraseFeedbackTimer=setTimeout(()=>{phraseFeedbackTimer=null;if(phraseFeedback&&phraseFeedback.epoch===epoch)clearPhraseFeedback();},900);
 }}
// Only a pointer echo landing on Save at nearly the same screen coordinate is ignored.
// Other buttons (especially Stop) are not globally debounced.
function ignoreNavigationEcho(e){if(!navigationTap||e.detail===0)return false;
 const n=navigationTap;if(performance.now()>n.until||n.dir!==data.location)return false;
 return Math.hypot(e.clientX-n.x,e.clientY-n.y)<=34;
}
const screen=document.getElementById('screen'),notice=document.getElementById('notice');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||!x.phrases||!x.names)return;for(const d of DIRS){if(!Array.isArray(x.phrases[d]))return;x.phrases[d]=x.phrases[d].filter(p=>p&&typeof p.text==='string'&&typeof p.id==='string');x.names[d]=String(x.names[d]||labels[d]).slice(0,30);}data={...initial(),...x};data.location=DIRS.includes(x.location)?x.location:'home';data.page=Math.max(0,Math.min(Number.isInteger(x.page)?x.page:0,pageCount(data.location)-1));data.rate=Number.isFinite(+x.rate)?Math.max(.6,Math.min(1.5,+x.rate)):1;data.mode=x.mode==='insert'?'insert':'speak';data.draft=typeof x.draft==='string'?x.draft:'';data.voicePreference=validVoicePreference(x.voicePreference);}catch(e){storageAvailable=false;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageAvailable=true;return true;}catch(e){storageAvailable=false;status('Browser storage unavailable: changes may not survive closing.');return false;}}
// Only browser-exposed voices are selectable; voice gender is not a standard Web Speech field.
// A preference is an identity hint, not a promise that a device/voice remains installed.
let availableVoices=[];
function validVoicePreference(v){if(!v||typeof v!=='object'||Array.isArray(v))return null;
 if(typeof v.uri!=='string'||typeof v.name!=='string'||typeof v.lang!=='string')return null;
 return {uri:v.uri.slice(0,500),name:v.name.slice(0,200),lang:v.lang.slice(0,60)};}
function voiceIdentity(v){return {uri:String(v.voiceURI||'').slice(0,500),name:String(v.name||'').slice(0,200),lang:String(v.lang||'').slice(0,60)};}
function selectedVoice(){const p=data.voicePreference;if(!p)return null;
 return availableVoices.find(v=>{const i=voiceIdentity(v);return i.uri===p.uri&&i.name===p.name&&i.lang===p.lang;})||
 availableVoices.find(v=>{const i=voiceIdentity(v);return i.name===p.name&&i.lang===p.lang;})||null;}
function refreshVoices(){try{const synth=window.speechSynthesis;
 availableVoices=synth&&typeof synth.getVoices==='function'?Array.from(synth.getVoices()||[]).filter(v=>v&&typeof v.name==='string'):[];
 }catch(e){availableVoices=[];}
 paintVoicePicker();return availableVoices.length;}
function paintVoicePicker(){const choice=document.getElementById('voice-choice');if(!choice)return;
 const chosen=selectedVoice();choice.innerHTML='<option value="default">Browser default voice</option>'+availableVoices.map((v,i)=>
 `<option value="${i}">${escapeHTML(v.name)} (${escapeHTML(v.lang||'unknown language')})${v.default?' — default':''}</option>`).join('');
 if(chosen)choice.value=String(availableVoices.indexOf(chosen));else choice.value='default';
 const note=document.getElementById('voice-note');if(note)note.textContent=
 data.voicePreference&&!chosen?'Saved voice is not available here. Browser default will be used; preference retained.':
 availableVoices.length?'Choose a voice by name and language; use Test Voice to listen.':'No voices listed yet. Refresh or use browser default. Speech may still work.';
}
function voiceControls(){return `<div class="voice-settings"><label for="voice-choice">Speaking voice</label><select id="voice-choice" aria-label="Speaking voice"><option value="default">Browser default voice</option></select><div class="voice-actions"><button id="voice-test" type="button">Test Voice</button><button id="voice-refresh" type="button">Refresh voices</button></div><p id="voice-note">Voices depend on this browser and device.</p><p>System TTS voice settings cannot reliably be opened from a web page. On Android, look under Settings → Accessibility → Text-to-speech output (names vary).</p></div>`;}
function wireVoiceControls(){const choice=document.getElementById('voice-choice');if(!choice)return;
 choice.onchange=()=>{const i=Number(choice.value);data.voicePreference=choice.value==='default'?null:(availableVoices[i]?voiceIdentity(availableVoices[i]):null);
 const persisted=save();paintVoicePicker();if(persisted)status(data.voicePreference?'Voice preference saved for this browser.':'Browser default voice selected.');};
 document.getElementById('voice-refresh').onclick=()=>{const n=refreshVoices();status(n?n+' browser voices listed.':'No voices reported by this browser yet.');};
 document.getElementById('voice-test').onclick=e=>{if(!speak('This is a voice test.',false,null))e.__cxRejected=true;};
 refreshVoices();}
function status(s){notice.textContent=s;}
function pageCount(dir){return dir==='home'?1:Math.max(1,Math.ceil(data.phrases[dir].length/PAGE_SIZE));}
// A single speech epoch owns browser callbacks. A late event from an older
// utterance must never recolor the Home button or report a newer session ended.
let speechEpoch=0,activeUtterance=null,terminalSpeechEpoch=null;
// A terminal callback is final for its utterance: late start/end/error must not
// overwrite its result, even if the speech epoch is still current.
const homeSpeech={phase:'idle',guardUntil:0,timer:null,stopEpoch:null,stopTimer:null,stopChecks:0};
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 100 100"><path d="M22 10 L90 50 L22 90 Z" fill="currentColor"/></svg>';
const STOP_ICON='<svg aria-hidden="true" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" rx="5" fill="currentColor"/></svg>';
function clearHomeTimers(){if(homeSpeech.timer!==null){clearTimeout(homeSpeech.timer);homeSpeech.timer=null;}if(homeSpeech.stopTimer!==null){clearTimeout(homeSpeech.stopTimer);homeSpeech.stopTimer=null;}}
function updateHomeSpeechButton(){const b=document.getElementById('home-speech-button');if(!b)return;
 const stopping=homeSpeech.phase==='stop'||homeSpeech.phase==='stopping';
 b.className=stopping?'stop-symbol':'play-symbol';b.dataset.phase=homeSpeech.phase==='idle'&&performance.now()<homeSpeech.guardUntil?'guarded-idle':homeSpeech.phase;
 b.innerHTML=stopping?STOP_ICON:PLAY_ICON;
 b.setAttribute('aria-label',stopping?(homeSpeech.phase==='stopping'?'Stop requested; press to retry':'Stop speaking'):'Speak typed text');
 b.title=stopping?'Stop speaking':'Speak typed text';
 b.setAttribute('aria-disabled',(homeSpeech.phase==='armed'||(homeSpeech.phase==='idle'&&performance.now()<homeSpeech.guardUntil))?'true':'false');
}
function resetHomeSpeech(keepGuard=false){clearHomeTimers();homeSpeech.phase='idle';homeSpeech.stopEpoch=null;homeSpeech.stopChecks=0;if(!keepGuard)homeSpeech.guardUntil=0;updateHomeSpeechButton();
 if(keepGuard)scheduleGuardRelease();
}
function scheduleGuardRelease(){const remaining=homeSpeech.guardUntil-performance.now();
 if(remaining<=0){updateHomeSpeechButton();return;}
 homeSpeech.timer=setTimeout(()=>{homeSpeech.timer=null;if(homeSpeech.phase==='idle')scheduleGuardRelease();},Math.max(1,Math.ceil(remaining)));
}
function speechEnded(epoch,kind){
 if(homeSpeech.phase==='stopping'&&homeSpeech.stopEpoch===epoch){if(terminalSpeechEpoch===epoch)return;terminalSpeechEpoch=epoch;resetHomeSpeech();status('Browser reported speech ended after Stop.');return;}
 if(epoch!==speechEpoch||terminalSpeechEpoch===epoch)return;
 terminalSpeechEpoch=epoch;
 updatePhraseFeedback(epoch,kind==='error'?'error':'ended');
 activeUtterance=null;
 resetHomeSpeech(true); // An early finish does not allow a second tap inside 500ms.
 status(kind==='error'?'Browser reported a speech error.':'Browser reported speech ended.');
}
function stopSpeech(report=false){
 const oldEpoch=speechEpoch,oldPhase=homeSpeech.phase;
 // Some Web Speech implementations may deliver onend *inside* cancel().
 // Publish Stop intent first, so that synchronous terminal callback is not lost.
 const awaitStop=report&&oldPhase==='stop';
 speechEpoch++;clearHomeTimers();
 if(awaitStop){homeSpeech.phase='stopping';homeSpeech.stopEpoch=oldEpoch;homeSpeech.stopChecks=0;updateHomeSpeechButton();}
 try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}
 catch(e){
  // If cancel both delivered a terminal event and threw, keep the observed end.
  if(awaitStop&&terminalSpeechEpoch===oldEpoch){activeUtterance=null;clearPhraseFeedback();return true;}
  speechEpoch=oldEpoch;
  if(awaitStop){homeSpeech.phase=oldPhase;homeSpeech.stopEpoch=null;homeSpeech.stopChecks=0;updateHomeSpeechButton();}
  if(homeSpeech.phase==='armed')scheduleHomeStop(oldEpoch);
  status('Could not stop browser speech.');return false;
 }
 activeUtterance=null;clearPhraseFeedback();
 if(awaitStop){
  // The synchronous terminal callback may already have reset the Home button.
  if(terminalSpeechEpoch===oldEpoch)return true;
  status('Stop requested; waiting for browser confirmation.');
  checkStopState(oldEpoch);return true;
 }
 resetHomeSpeech();if(report)status('Speech stop requested; audible stop not confirmed.');return true;
}
function checkStopState(epoch){
 if(homeSpeech.phase!=='stopping'||homeSpeech.stopEpoch!==epoch)return;
 const synth=window.speechSynthesis;
 if(synth&&typeof synth.speaking==='boolean'&&typeof synth.pending==='boolean'&&!synth.speaking&&!synth.pending){resetHomeSpeech();status('Browser reports speech stopped.');return;}
 // A delayed or absent Web Speech event is not evidence of cancellation.
 if(++homeSpeech.stopChecks>8){status('Stop requested; browser speech state remains unconfirmed.');return;}
 homeSpeech.stopTimer=setTimeout(()=>{homeSpeech.stopTimer=null;if(homeSpeech.phase==='stopping'&&homeSpeech.stopEpoch===epoch)checkStopState(epoch);},250);
}
function speak(text,fromHome=false,phraseId=null){
 if(!String(text).trim()){status('Type or choose a phrase first.');return false;}
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('Speech is not available in this browser.');return false;}
 if(!stopSpeech())return false;
 const epoch=++speechEpoch;terminalSpeechEpoch=null;
 if(fromHome){homeSpeech.phase='armed';homeSpeech.guardUntil=performance.now()+500;updateHomeSpeechButton();}
 try{
  const u=new SpeechSynthesisUtterance(text);u.rate=data.rate;
  // If the chosen voice disappeared, use browser default without erasing the saved preference.
  const v=selectedVoice();if(v)u.voice=v;activeUtterance=u;
  u.onstart=()=>{if(epoch===speechEpoch&&terminalSpeechEpoch!==epoch){updatePhraseFeedback(epoch,'started');status('Browser reported speech started.');}};
  u.onend=()=>speechEnded(epoch,'end');u.onerror=()=>speechEnded(epoch,'error');
  status('Speech requested; browser may start with delay.');
  if(phraseId){phraseFeedback={dir:data.location,id:phraseId,epoch,phase:'requested'};paintPhraseFeedback();}
  window.speechSynthesis.speak(u);
  if(fromHome&&homeSpeech.phase==='armed')scheduleHomeStop(epoch);
  return true;
 }catch(e){if(epoch===speechEpoch){speechEpoch++;activeUtterance=null;clearPhraseFeedback();resetHomeSpeech();status('Speech failed in this browser.');}return false;}
}
function scheduleHomeStop(epoch){
 const remaining=Math.max(0,homeSpeech.guardUntil-performance.now());
 homeSpeech.timer=setTimeout(()=>{homeSpeech.timer=null;
  if(epoch!==speechEpoch||homeSpeech.phase!=='armed')return;
  if(performance.now()<homeSpeech.guardUntil){scheduleHomeStop(epoch);return;}
  homeSpeech.phase='stop';updateHomeSpeechButton();
 },remaining);
}
function homeSpeechPress(e){
 const now=performance.now();
 // Guard is based on acceptance time, not when a delayed timer happened to run.
 if(now<homeSpeech.guardUntil){if(e)e.__cxRejected=true;return;}
 if(homeSpeech.phase==='armed'){homeSpeech.phase='stop';updateHomeSpeechButton();}
 if(homeSpeech.phase==='stop'||homeSpeech.phase==='stopping'){if(!stopSpeech(true)&&e)e.__cxRejected=true;return;}
 if(!speak(data.draft,true)&&e)e.__cxRejected=true;
}
function navigate(dir,page=0){navigationTap=null;stopSpeech();data.location=dir;data.page=Math.max(0,Math.min(page,pageCount(dir)-1));expanded=null;organizing=false;saveOpen=false;editOpen=false;save();render();}
// Owner's 2026-11-15 physical-phone correction: the finger pulls content in the
// opposite direction to the destination: right-to-left opens Right, and
// up-to-down opens Above. Reverse slides back ONE page, then Home from page 1.
// Perpendicular swipe always switches to the other collection's page 1.
const SWIPE_TO_BRANCH={up:'bottom',down:'top',left:'right',right:'left'};
const OPPOSITE_BRANCH={top:'bottom',bottom:'top',left:'right',right:'left'};
function directionalInput(step){
 const target=SWIPE_TO_BRANCH[step];if(!target)return;
 if(data.location==='home'){navigate(target,0);return;}
 if(target===data.location){navigate(target,data.page+1);return;}
 if(target===OPPOSITE_BRANCH[data.location]){
  if(data.page>0)navigate(data.location,data.page-1);
  else navigate('home');
  return;
 }
 navigate(target,0);
}
function moveSwipe(dx,dy){const horiz=Math.abs(dx)>Math.abs(dy);const step=horiz?(dx<0?'left':'right'):(dy<0?'up':'down');directionalInput(step);}
function render(){
 document.getElementById('app').classList.toggle('is-home',data.location==='home');
 document.getElementById('app').classList.toggle('is-branch',data.location!=='home');
 document.getElementById('app').dataset.direction=data.location;
 for(const d of DIRS){const tab=document.getElementById('tab-'+d);tab.textContent={top:'↑ ',right:'→ ',bottom:'↓ ',left:'← '}[d]+data.names[d];tab.setAttribute('aria-label',d+' — '+data.names[d]+' collection');if(data.location===d)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current');}
 document.getElementById('location').textContent=data.location==='home'?'Home':data.names[data.location];
 if(data.location==='home')renderHome();else renderBranch();
}
function speechControls(){return `<div class="speed"><label for="rate">Speech speed</label><input id="rate" type="range" min="0.6" max="1.5" step="0.1" value="${data.rate}" aria-label="Speech speed"><output id="rate-output">${data.rate.toFixed(1)}×</output></div>`;}
function renderHome(){screen.innerHTML=`<h1 class="sr-only">Say something</h1>
 <div class="home-speech"><button class="play-symbol" id="home-speech-button" type="button" aria-label="Speak typed text" title="Speak typed text">${PLAY_ICON}</button></div>
 <label class="sr-only" for="draft">Message to speak</label><textarea class="editor" id="draft" spellcheck="true" autocomplete="on" autocapitalize="sentences" placeholder="Type your message…">${escapeHTML(data.draft)}</textarea>
 <div class="home-bottom"><button id="edit-open" type="button" aria-expanded="${editOpen}">Edit</button><button id="save-open" type="button">Save phrase</button>${speechControls()}</div>
 <div id="edit-slot"></div><div id="save-slot"></div>`;
 document.getElementById('draft').addEventListener('input',e=>{data.draft=e.target.value;save();});
 document.getElementById('home-speech-button').onclick=homeSpeechPress;updateHomeSpeechButton();
 document.getElementById('save-open').onclick=()=>{saveOpen=!saveOpen;editOpen=false;renderHome();};
 document.getElementById('edit-open').onclick=()=>{editOpen=!editOpen;saveOpen=false;renderHome();};
 wireShared();renderSaveBox();renderEditBox();
}
function renderEditBox(){const slot=document.getElementById('edit-slot');if(!slot||!editOpen)return;
 slot.innerHTML=`<div class="edit-overlay" role="region" aria-label="Edit options"><button id="edit-close" type="button">Close editing</button><h2>Communication settings</h2>${modeControls()}<p>Choose whether tapping saved phrases speaks immediately or inserts them into the Home editor.</p>${voiceControls()}${backupControls()}</div>`;
 document.getElementById('edit-close').onclick=()=>{editOpen=false;renderHome();};wireShared();wireVoiceControls();wireBackupControls();}
// Phrase backups are explicit user-chosen local JSON files; never uploaded to the website.
const BACKUP_KIND='crossxspeak-standard-backup';
function backupControls(){return `<section class="backup-controls" aria-label="Phrase backup and restore"><h3>Back up your phrases</h3><p>Keep a copy outside the browser. A separate browser or installed home-screen app does not protect your phrases if site data is cleared.</p><div class="backup-buttons"><button id="backup-export" type="button">Download backup</button><button id="backup-import" type="button">Restore backup</button></div><input type="file" id="backup-file-input" accept=".json,application/json" hidden><p>Restoring replaces all phrases and settings in this app. Download your current backup first.</p></section>`;}
function makeBackup(){return {format:BACKUP_KIND,version:1,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data))};}
function exportBackup(){
 try{
  const contents=JSON.stringify(makeBackup(),null,2)+'\n';
  const blob=new Blob([contents],{type:'application/json'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=href;a.download='CrossXSpeak_Standard_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),60000);
  status('Backup download requested. Keep the JSON file in a safe place outside the browser.');
 }catch(err){status('Backup could not be downloaded.');window.alert('Could not download the backup: '+err.message);}
}
function validateBackupFile(obj){
 if(!obj||obj.format!==BACKUP_KIND||obj.version!==1||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data))throw Error('This is not a supported Cross X Speak Standard backup.');
 const src=obj.data;
 if(!src.names||!src.phrases||typeof src.names!=='object'||typeof src.phrases!=='object')throw Error('Missing phrase collections.');
 const clean=initial();
 for(const dir of DIRS){
  const items=src.phrases[dir],name=src.names[dir];
  if(!Array.isArray(items)||items.length>5000||typeof name!=='string'||name.length>100)throw Error('Invalid '+labels[dir]+' collection.');
  const ids=new Set();
  clean.phrases[dir]=items.map(p=>{
   if(!p||typeof p!=='object'||typeof p.id!=='string'||!p.id||p.id.length>500||typeof p.text!=='string'||p.text.length>10000||ids.has(p.id))throw Error('Invalid phrase in '+labels[dir]+'.');
   ids.add(p.id);return {id:p.id,text:p.text};
  });
  clean.names[dir]=name.slice(0,30)||labels[dir];
 }
 if(src.draft!==undefined&&(typeof src.draft!=='string'||src.draft.length>500000))throw Error('Invalid saved draft.');
 clean.draft=src.draft||'';
 clean.mode=src.mode==='insert'?'insert':'speak';
 clean.rate=Number.isFinite(Number(src.rate))?Math.max(.6,Math.min(1.5,Number(src.rate))):1;
 clean.voicePreference=validVoicePreference(src.voicePreference);
 // Don't restore an old page location or resume speech after an import.
 clean.location='home';clean.page=0;
 return clean;
}
function wireBackupControls(){
 const fileInput=document.getElementById('backup-file-input');
 if(!fileInput)return;
 document.getElementById('backup-export').onclick=exportBackup;
 document.getElementById('backup-import').onclick=()=>fileInput.click();
 fileInput.onchange=async()=>{
  const file=fileInput.files&&fileInput.files[0];fileInput.value='';if(!file)return;
  if(file.size>6*1024*1024){window.alert('Backup is too large (maximum 6 MB).');return;}
  let restored;
  try{restored=validateBackupFile(JSON.parse(await file.text()));}
  catch(err){window.alert('Backup not loaded: '+err.message);return;}
  const n=DIRS.reduce((count,dir)=>count+restored.phrases[dir].length,0);
  if(!window.confirm('Restore '+n+' phrases? This REPLACES all current phrases and settings in Cross X Speak. Download a backup first if you want to keep them.'))return;
  try{localStorage.setItem(KEY,JSON.stringify(restored));}
  catch(err){storageAvailable=false;window.alert('Restore could not be saved in browser storage. Your existing phrases were not changed.');return;}
  stopSpeech();data=restored;storageAvailable=true;saveOpen=false;editOpen=false;organizing=false;expanded=null;render();
  status('Restored '+n+' phrases. Your backup file is unchanged.');
 };
}

// B437: static, source-matched guide; no invented device screenshots or external assets.
// A guide page never changes saved phrases, collection position or voice preference.
const GUIDE_PAGES=[
 {title:'Start here: type and speak',html:`<p>Home is the large typing screen. Tap the white message box and type with your phone’s usual keyboard. The keyboard’s autocorrect and suggestions depend on your device.</p><p>Press the large green triangle above the message to request speech. After roughly half a second, the control changes to a red square Stop button. A second tap during that short changeover is ignored to avoid accidental repeats.</p><p class="guide-note">This is a browser speech request. Hearing the voice depends on your browser, volume, installed voices and device.</p>`},
 {title:'Stop and interruptions',html:`<p>Press the red square on Home, or <strong>Stop speech</strong> on a phrase page, to request an immediate stop. Starting another saved phrase interrupts the previous request.</p><p>Opening this guide stops a current speech request. The app also requests a stop when the browser page becomes hidden or closes. Screen-lock behavior depends on the browser and still needs a phone trial.</p><p class="guide-note">Do not depend on this browser prototype for emergency communication until it has been tested on the intended phone.</p>`},
 {title:'Find your four collections',html:`<p>The colored, labeled edge tabs open your collections. Above is blue, Right green, Below orange and Left red by default. Names can be changed.</p><p>The tabs point toward each collection. To <strong>pull content toward a destination</strong>, swipe the other way: swipe <strong>down</strong> for Above, <strong>up</strong> for Below, <strong>right</strong> for Left, and <strong>left</strong> for Right. From Home each opens at page 1. You can start a swipe over phrase buttons too; a simple tap still activates the button.</p><p>From a phrase page, the house icon always returns directly to Home.</p>`},
 {title:'Move between pages',html:`<p>Each collection shows up to four saved phrases per page. <strong>Repeat the same finger motion</strong> to go one page deeper: swipe left twice for Right page 2, or down twice for Above page 2.</p><p><strong>Reverse the swipe</strong> to go <strong>one page nearer Home</strong>: from Above page 2, swipe up to Above page 1; swipe up again to Home. The separate Home button always goes Home immediately.</p><p>The existing <strong>Farther out</strong> and <strong>Nearer Home</strong> buttons separately let you browse forward/back by one page without swiping. The position bar is vertical for Above/Below and horizontal for Left/Right, advancing in the direction of the collection.</p>`},
 {title:'Switch branches and reopen',html:`<p>Choose a <strong>perpendicular</strong> swipe to enter another collection at <strong>page 1</strong>, regardless of your current depth. For example: swipe down twice to Above page 2, then swipe right to Left page 1. An opposite swipe from Left page 1 returns Home.</p><p>Tap a named directional tab as an alternative to a swipe. Tabs identify the destination direction; finger motion is opposite the destination arrow. The house button returns Home from any page.</p><p>When you reopen the same browser profile, the app attempts to restore the <strong>exact collection and page</strong> you last used. Reopening does <strong>not</strong> resume speech automatically.</p><p class="guide-note">Restoration relies on this browser’s local storage. Private/incognito mode, clearing site data, browser cleanup or storage failures can lose saved phrases and position.</p>`},
 {title:'Save a phrase',html:`<p>Type a message on Home, then tap <strong>Save phrase</strong>. Review or edit its text, choose the destination collection and press <strong>Save phrase</strong> again.</p><p>On a collection page, <strong>Save phrase</strong> opens the same editor. Empty phrase text is rejected. New phrases are added at the end of that collection; use Order Edit to move them earlier.</p><p>Watch for a storage warning: a displayed change is not proof it survived closing if browser storage is unavailable.</p>`},
 {title:'Speak or insert saved phrases',html:`<p>By default, tapping the main body of a saved phrase speaks it immediately. To change this for <strong>all</strong> saved phrases, go to Home, tap <strong>Edit</strong>, and find <strong>Saved phrases</strong>.</p><p>Choose <strong>Insert to edit</strong> to place a tapped phrase in the Home typing box instead. Correct it using the normal keyboard, then press Play. Choose <strong>Speak immediately</strong> to restore direct speaking.</p><p>This is one global setting, not a different setting for each phrase.</p>`},
 {title:'Read long phrases',html:`<p>Tap <strong>Expand</strong> beside a saved phrase to reveal its complete text without starting speech. Tap <strong>Collapse</strong> or navigate away to hide it.</p><p>The main phrase button still follows your global Speak/Insert choice. Use Expand when you need to check a long phrase before selecting it.</p>`},
 {title:'Text Edit and collection names',html:`<p>Open a collection and tap <strong>Edit</strong>. Select <strong>Text Edit</strong> to change the collection name, edit an existing phrase, or remove one.</p><p>After changing text, tap its <strong>Save text</strong> button. To change the collection name, use <strong>Rename</strong>. <strong>Remove</strong> asks for confirmation before deleting a phrase.</p><p>Use <strong>Close editing</strong> to return to the phrase page. Home’s Edit button is different: it opens communication settings.</p>`},
 {title:'Order Edit: move phrases',html:`<p>In a collection, tap <strong>Edit</strong>, then <strong>Order Edit</strong>. This list includes phrases from <strong>all pages</strong> of that collection.</p><p>Use large <strong>Earlier</strong>, <strong>Later</strong>, <strong>Top</strong> and <strong>Bottom</strong> buttons to reposition phrases. The <strong>↕ Move</strong> handle also offers experimental drag-and-drop, but touch dragging has <strong>not</strong> been verified on a real phone.</p><p>After a successful move, the current page follows the moved phrase. If a save fails, the earlier order is restored in memory.</p>`},
 {title:'Speech speed and voice',html:`<p>On Home, adjust the <strong>Speech speed</strong> slider beside the edit/save controls. It affects future speech requests.</p><p>Home → <strong>Edit</strong> → <strong>Speaking voice</strong> lets you choose a browser-provided voice. Press <strong>Test Voice</strong> to hear a sample, or <strong>Refresh voices</strong> if the list is empty. Voice availability, language, offline support and names depend on the browser and phone.</p><p>Web pages cannot reliably open Android’s system voice settings. Look under Android Settings → Accessibility → Text-to-speech output; the path may differ.</p>`},
 {title:'Back up and restore phrases',html:`<p>At Home, tap <strong>Edit</strong>, then <strong>Download backup</strong> to save your phrase collections, text draft, voice preference and settings as a JSON file. Keep that file in Downloads, a USB drive, or another safe location outside this browser.</p><p>To recover phrases, choose <strong>Restore backup</strong>, select the saved JSON file, and confirm. Restore <strong>replaces</strong> your current phrases and settings; make a current backup first. Files are handled on your device, not sent to this website.</p><p>Clearing the browser’s <strong>site data</strong>, uninstalling or resetting its profile can erase locally saved phrases. A dedicated browser helps isolate usage but is not itself a backup.</p>`},
 {title:'Troubleshooting and privacy',html:`<ul><li><strong>No sound?</strong> Check phone volume, whether the browser supports speech, and try Test Voice. Some voices need network access even though the HTML itself is local.</li><li><strong>Wrong page after reopening?</strong> Check whether you used the same browser/profile and whether site data was cleared.</li><li><strong>A swipe changed pages unexpectedly?</strong> Use the large named directional tabs or the separate Nearer/Farther page buttons instead. Repeat the same finger motion to go deeper; reverse it to move one page back.</li><li><strong>Changes did not stay?</strong> Look for a browser-storage warning. Use Home → Edit → Download backup, and keep the JSON file outside the browser.</li></ul><p class="guide-note">Saved phrases and preferences are stored locally in this browser profile; no account or server sync is provided. Standard and Visual Editions are separate apps. This v0.2.3 browser candidate has not been tested on your phone yet.</p>`}
];
